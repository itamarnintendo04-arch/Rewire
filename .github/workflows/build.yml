name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i '' "s/MARKETING_VERSION: \".*\"/MARKETING_VERSION: \"$VERSION\"/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: \".*\"/CURRENT_PROJECT_VERSION: \"$GITHUB_RUN_NUMBER\"/" project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild \
            -project Rewire.xcodeproj \
            -target Rewire \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*Swift|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log || { echo "---- last 150 lines ----"; tail -150 build.log; exit 1; }

      - name: Embed entitlements (ad-hoc sign)
        run: |
          APP="build/Release-iphoneos/Rewire.app"
          for EXT in "$APP"/PlugIns/*.appex; do
            NAME=$(basename "$EXT" .appex)
            ENT=$(find Extensions -name "$NAME.entitlements" | head -1)
            echo "Signing $NAME with $ENT"
            codesign --force --sign - --entitlements "$ENT" "$EXT"
          done
          codesign --force --sign - --entitlements App/Rewire.entitlements "$APP"
          codesign -d --entitlements :- "$APP"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Rewire.app Payload/
          zip -qry Rewire.ipa Payload
          ls -lh Rewire.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Rewire-ipa
          path: Rewire.ipa

      - name: Read version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            V=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"(.*)".*/\1/')
            echo "tag=v$V" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Rewire ${{ steps.ver.outputs.tag }}
          make_latest: true
          overwrite_files: true
          files: Rewire.ipa
          body: |
            ## Rewire ${{ steps.ver.outputs.tag }}

            Built from commit ${{ github.sha }}.

            **Install:** `Rewire.ipa` is an unsigned iOS build with its entitlements embedded.
            Re-sign it with your own Apple ID or developer certificate, for example with
            Sideloadly, AltStore or Xcode.

            **Requirements:** a real iPhone running iOS 16 or later. Screen Time blocking needs the
            **Family Controls** capability on the signing account.

            ### What's inside
            - Onboarding: name, exact age, quiz, current screen time and goal, Brain Rot score, life projection
            - Apple Screen Time connection and an app, category and website picker
            - Daily limit, scheduled block times, focus sessions
            - Custom block screen, an unlock flow with friction, strict mode
            - Screen time reports, goal progress, weekly chart, streaks
