name: Rewire
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # <- put your Apple Team ID here
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Rewire:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rewire
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Rewire
        CFBundleDevelopmentRegion: en
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/Rewire.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.example.rewire]
    dependencies:
      - target: RewireMonitor
      - target: RewireShieldConfiguration
      - target: RewireShieldAction
      - target: RewireReport
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework

  RewireMonitor:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/Monitor
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rewire.monitor
    info:
      path: Extensions/Monitor/Info.plist
      properties:
        CFBundleDisplayName: RewireMonitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: Extensions/Monitor/RewireMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.example.rewire]

  RewireShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/ShieldConfiguration
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rewire.shieldconfig
    info:
      path: Extensions/ShieldConfiguration/Info.plist
      properties:
        CFBundleDisplayName: RewireShieldConfiguration
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: Extensions/ShieldConfiguration/RewireShieldConfiguration.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.example.rewire]

  RewireShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/ShieldAction
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rewire.shieldaction
    info:
      path: Extensions/ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: RewireShieldAction
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: Extensions/ShieldAction/RewireShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.example.rewire]

  RewireReport:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/Report
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rewire.report
    info:
      path: Extensions/Report/Info.plist
      properties:
        CFBundleDisplayName: RewireReport
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    entitlements:
      path: Extensions/Report/RewireReport.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.example.rewire]
